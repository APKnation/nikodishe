# ─── JVM Memory (tuned for 14GB RAM machine) ───────────────────────────────
# Ilipunguzwa kutoka 8G → 2G ili RAM isiishe (RAM yako inakuwa tight)
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseG1GC

# ─── Gradle Performance ─────────────────────────────────────────────────────
# Daemon inabaki hai kati ya builds → build ya pili ni haraka zaidi
org.gradle.daemon=true

# Parallel builds: hutumia cores zote (una 6 cores)
org.gradle.parallel=true

# Build cache: tasks zilizofanywa tayari hazifanywi tena
org.gradle.caching=true

# Lazy configuration: plugins zinafungua tu zinapohitajika
org.gradle.configureondemand=true

# Configuration cache IMEZIMWA — Flutter Gradle plugin haiungani nayo bado
# org.gradle.configuration-cache=true

# ─── Android ────────────────────────────────────────────────────────────────
android.useAndroidX=true
android.newDsl=false
android.builtInKotlin=false

# Non-transitive R classes: builds haraka, inasaidia memory pia
android.nonTransitiveRClass=true
